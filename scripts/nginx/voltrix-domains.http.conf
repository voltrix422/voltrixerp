# HTTP-only bootstrap — use before Let's Encrypt certs exist.
# setup-multi-domain-nginx.sh installs this when /etc/letsencrypt/live/*/fullchain.pem is missing.
# After: sudo certbot --nginx -d voltrixpv.com -d www.voltrixpv.com ...

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream voltrix_nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name
        voltrixpv.com www.voltrixpv.com
        voltrix-power.com www.voltrix-power.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 50M;

    location / {
        proxy_pass http://voltrix_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# Voltrix ERP / public website — multiple domains → one Next.js app (port 3000)
#
# Install on VPS:
#   sudo cp scripts/nginx/voltrix-domains.conf /etc/nginx/sites-available/voltrix-erp
#   sudo ln -sf /etc/nginx/sites-available/voltrix-erp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (add your existing primary domain to the certbot -d list if you use HTTPS there):
#   sudo certbot --nginx \
#     -d voltrixpv.com -d www.voltrixpv.com \
#     -d voltrix-power.com -d www.voltrix-power.com \
#     -d voltrixbatteries.com -d www.voltrixbatteries.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream voltrix_nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name
        voltrixpv.com www.voltrixpv.com
        voltrix-power.com www.voltrix-power.com
        voltrixbatteries.com www.voltrixbatteries.com
        voltrixev.com www.voltrixev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — all domains serve the same app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name
        voltrixpv.com www.voltrixpv.com
        voltrix-power.com www.voltrix-power.com
        voltrixbatteries.com www.voltrixbatteries.com
        voltrixev.com www.voltrixev.com;

    # After certbot, paths usually look like this (adjust if certbot picks one name as folder):
    ssl_certificate     /etc/letsencrypt/live/voltrixpv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voltrixpv.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 50M;

    location / {
        proxy_pass http://voltrix_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
